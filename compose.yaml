name: homelab

services:
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=${WATCHTOWER_CLEANUP}
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL}
      - WATCHTOWER_LABEL_ENABLE=${WATCHTOWER_LABEL_ENABLE}
      - TZ=${TZ}
    labels:
      # Kuma (Docker host is socket-proxy via TCP)
      - kuma.watchtower.docker.name=Watchtower
      - kuma.watchtower.docker.docker_container=watchtower
      - kuma.watchtower.docker.docker_host_name=socket_proxy_docker_host

  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - all
    environment:
      - TZ=${TZ}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAINS=${CLOUDFLARE_DDNS_DOMAINS}
      - PROXIED=${CLOUDFLARE_DDNS_PROXIED}
      - DETECTION_MODE=${CLOUDFLARE_DDNS_DETECTION_MODE}
      - HTTP_TIMEOUT=${CLOUDFLARE_DDNS_HTTP_TIMEOUT}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Kuma (Docker host is socket-proxy via TCP)
      - kuma.cloudflare-ddns.docker.name=Cloudflare DDNS
      - kuma.cloudflare-ddns.docker.docker_container=cloudflare-ddns
      - kuma.cloudflare-ddns.docker.docker_host_name=socket_proxy_docker_host

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - socket_proxy
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /run
    environment:
      - LOG_LEVEL=${SOCKET_PROXY_LOG_LEVEL}
      - ALLOW_START=${SOCKET_PROXY_ALLOW_START}
      - ALLOW_STOP=${SOCKET_PROXY_ALLOW_STOP}
      - ALLOW_RESTARTS=${SOCKET_PROXY_ALLOW_RESTARTS}
      - EVENTS=${SOCKET_PROXY_EVENTS}
      - PING=${SOCKET_PROXY_PING}
      - VERSION=${SOCKET_PROXY_VERSION}
      - AUTH=${SOCKET_PROXY_AUTH}
      - SECRETS=${SOCKET_PROXY_SECRETS}
      - POST=${SOCKET_PROXY_POST}
      - BUILD=${SOCKET_PROXY_BUILD}
      - COMMIT=${SOCKET_PROXY_COMMIT}
      - CONFIGS=${SOCKET_PROXY_CONFIGS}
      - CONTAINERS=${SOCKET_PROXY_CONTAINERS}
      - DISTRIBUTION=${SOCKET_PROXY_DISTRIBUTION}
      - EXEC=${SOCKET_PROXY_EXEC}
      - IMAGES=${SOCKET_PROXY_IMAGES}
      - INFO=${SOCKET_PROXY_INFO}
      - NETWORKS=${SOCKET_PROXY_NETWORKS}
      - NODES=${SOCKET_PROXY_NODES}
      - PLUGINS=${SOCKET_PROXY_PLUGINS}
      - SERVICES=${SOCKET_PROXY_SERVICES}
      - SESSION=${SOCKET_PROXY_SESSION}
      - SWARM=${SOCKET_PROXY_SWARM}
      - SYSTEM=${SOCKET_PROXY_SYSTEM}
      - TASKS=${SOCKET_PROXY_TASKS}
      - VOLUMES=${SOCKET_PROXY_VOLUMES}
      - DISABLE_IPV6=${SOCKET_PROXY_DISABLE_IPV6}
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Kuma – single Docker host via socket-proxy (TCP); container monitors reference this
      - kuma.socket_proxy_docker_host.docker_host.name=Socket Proxy (Docker)
      - kuma.socket_proxy_docker_host.docker_host.connection_type=tcp
      - kuma.socket_proxy_docker_host.docker_host.path=tcp://socket-proxy:2375

  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik_network
      - socket_proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - CF_DNS_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_DIR}/services/traefik/acme/acme.json:/acme.json
      - ${DATA_DIR}/services/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${DATA_DIR}/services/traefik/dynamic:/etc/traefik/dynamic:ro
    labels:
      # Kuma
      - kuma.traefik.http.name=Traefik
      - kuma.traefik.http.url=http://traefik:8080/ping
      - kuma.traefik.http.interval=60

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      - traefik_network
    volumes:
      - ${DATA_DIR}/services/authelia/config:/config
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.authelia.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.authelia.entrypoints=websecure
      - traefik.http.routers.authelia.tls.certresolver=cloudflare
      # Kuma
      - kuma.authelia.http.name=Authelia
      - kuma.authelia.http.url=http://authelia:9091/api/health
      - kuma.authelia.http.interval=60

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik_network
      - socket_proxy
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/services/uptime-kuma/data:/app/data
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.uptime.rule=Host(`status.${DOMAIN}`)
      - traefik.http.routers.uptime.entrypoints=websecure
      - traefik.http.routers.uptime.tls=true
      - traefik.http.routers.uptime.tls.certresolver=cloudflare
      - traefik.http.routers.uptime.middlewares=authelia@file
      - traefik.http.services.uptime.loadbalancer.server.port=3001

  autokuma:
    image: ghcr.io/bigboot/autokuma:latest
    container_name: autokuma
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      - AUTOKUMA__KUMA__URL=http://uptime-kuma:3001
      - AUTOKUMA__DOCKER__HOSTS=tcp://socket-proxy:2375
      - AUTOKUMA__KUMA__SYNC_INTERVAL=60
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/services/autokuma/data:/data
    networks:
      - traefik_network
      - socket_proxy
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    networks:
      - traefik_network
      - socket_proxy
    environment:
      - DOZZLE_LEVEL=${DOZZLE_LEVEL}
      - DOZZLE_FILTER=${DOZZLE_FILTER}
      - DOZZLE_REMOTE_HOST=${DOZZLE_REMOTE_HOST}
      - DOZZLE_AUTH_PROVIDER=${DOZZLE_AUTH_PROVIDER}
      - DOZZLE_AUTH_HEADER_USER=${DOZZLE_AUTH_HEADER_USER}
      - TZ=${TZ}
    labels:
      # Watchtower/home/mike/Documents/homelab/.env
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.dozzle.rule=Host(`logs.${DOMAIN}`)
      - traefik.http.routers.dozzle.entrypoints=websecure
      - traefik.http.routers.dozzle.tls=true
      - traefik.http.routers.dozzle.tls.certresolver=cloudflare
      - traefik.http.routers.dozzle.middlewares=authelia@file
      - traefik.http.services.dozzle.loadbalancer.server.port=8080
      # Kuma (Docker host is socket-proxy via TCP)
      - kuma.dozzle.docker.name=Dozzle
      - kuma.dozzle.docker.docker_container=dozzle
      - kuma.dozzle.docker.docker_host_name=socket_proxy_docker_host

  mcclean:
    image: mcclean:latest
    container_name: mcclean
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    networks:
      - traefik_network
    environment:
      - TZ=${TZ}
      - MCCLEAN_ADMIN_USERNAME=${MCCLEAN_ADMIN_USERNAME}
      - MCCLEAN_ADMIN_PASSWORD=${MCCLEAN_ADMIN_PASSWORD}
    volumes:
      - ${DATA_DIR}/services/mccleanengineering/data:/mcclean_data
    entrypoint: ["/usr/local/bin/mcclean", "serve", "--data-dir", "/mcclean_data", "--http", "0.0.0.0:8080"]
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik (no authelia — app handles its own login)
      - traefik.enable=true
      - traefik.http.routers.mcclean.rule=Host(`demo.${DOMAIN}`)
      - traefik.http.routers.mcclean.entrypoints=websecure
      - traefik.http.routers.mcclean.tls=true
      - traefik.http.routers.mcclean.tls.certresolver=cloudflare
      - traefik.http.services.mcclean.loadbalancer.server.port=8080
      # Kuma
      - kuma.mcclean.http.name=McClean Engineering
      - kuma.mcclean.http.url=http://mcclean:8080
      - kuma.mcclean.http.interval=60

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    user: "${PUID}:983"
    networks:
      - traefik_network
      - socket_proxy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=home.${DOMAIN},192.168.90.0/24
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ${DATA_DIR}/services/homepage/config:/app/config
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`home.${DOMAIN}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls=true
      - traefik.http.routers.homepage.tls.certresolver=cloudflare
      - traefik.http.routers.homepage.middlewares=authelia@file
      - traefik.http.services.homepage.loadbalancer.server.port=3000
      # Kuma
      - kuma.homepage.http.name=Homepage
      - kuma.homepage.http.url=http://homepage:3000
      - kuma.homepage.http.interval=60

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    group_add:
      - "991"
    networks:
      - traefik_network
    ports:
      - "8096:8096"
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/services/jellyfin/config:/config
      - ${DATA_DIR}/services/jellyfin/cache:/cache
      - ${DATA_DIR}/services/jellyfin/logs:/logs
      - ${MEDIA1_DIR}:/media
      - ${MEDIA2_DIR}:/media2
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`tv.${DOMAIN}`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.routers.jellyfin.tls.certresolver=cloudflare
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      # Kuma
      - kuma.jellyfin.http.name=Jellyfin
      - kuma.jellyfin.http.url=http://jellyfin:8096
      - kuma.jellyfin.http.interval=60

  jellyscope:
    image: jellyscope:latest
    container_name: jellyscope
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik_network
    environment:
      - HOST=0.0.0.0
      - PORT=8097
      - SECRET_KEY=${JELLYSCOPE_SECRET_KEY}
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - SECURE_COOKIES=1
      - FORWARDED_ALLOW_IPS=192.168.90.0/24 
      - TZ=${TZ}
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
    volumes:
      - ${DATA_DIR}/services/jellyscope/data:/app/data
      - ${MEDIA1_DIR}:/media:ro
      - ${MEDIA2_DIR}:/media2:ro
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.jellyscope.rule=Host(`tv-stats.${DOMAIN}`)
      - traefik.http.routers.jellyscope.entrypoints=websecure
      - traefik.http.routers.jellyscope.tls=true
      - traefik.http.routers.jellyscope.tls.certresolver=cloudflare
      - traefik.http.routers.jellyscope.middlewares=authelia@file
      - traefik.http.services.jellyscope.loadbalancer.server.port=8097
      # Kuma
      - kuma.jellyscope.http.name=Jellyscope
      - kuma.jellyscope.http.url=http://jellyscope:8097
      - kuma.jellyscope.http.interval=60
      
  audiobookshelf:
    image: advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    networks:
      - traefik_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    mem_limit: 4g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    restart: on-failure:5
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${AUDIOBOOKS_DIR}:/audiobooks
      - ${DATA_DIR}/services/audiobookshelf/config:/config
      - ${DATA_DIR}/services/audiobookshelf/metadata:/metadata
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.audiobooks.rule=Host(`books.${DOMAIN}`)
      - traefik.http.routers.audiobooks.entrypoints=websecure
      - traefik.http.routers.audiobooks.tls=true
      - traefik.http.routers.audiobooks.tls.certresolver=cloudflare
      - traefik.http.services.audiobooks.loadbalancer.server.port=80
      # Kuma
      - kuma.audiobooks.http.name=Audiobookshelf
      - kuma.audiobooks.http.url=http://audiobookshelf:80
      - kuma.audiobooks.http.interval=60

  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    networks:
      - traefik_network
    volumes:
      - ${DATA_DIR}/services/mealie/data:/app/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - BASE_URL=https://food.${DOMAIN}
      - OIDC_AUTH_ENABLED=true
      - OIDC_SIGNUP_ENABLED=true
      - OIDC_CONFIGURATION_URL=https://auth.${DOMAIN}/.well-known/openid-configuration
      - OIDC_CLIENT_ID=mealie
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_AUTO_REDIRECT=false
      - OIDC_ADMIN_GROUP=mealie-admins
      - OIDC_USER_GROUP=mealie-users
      - OIDC_USER_CLAIM=email
      - OIDC_NAME_CLAIM=name
      - OIDC_GROUPS_CLAIM=groups
      - OPENAI_API_KEY=${MEALIE_OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4o
      - OPENAI_ENABLE_IMAGE_SERVICES=true
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.mealie.rule=Host(`food.${DOMAIN}`)
      - traefik.http.routers.mealie.entrypoints=websecure
      - traefik.http.routers.mealie.tls=true
      - traefik.http.routers.mealie.tls.certresolver=cloudflare
      # Kuma
      - kuma.mealie.http.name=Mealie
      - kuma.mealie.http.url=http://mealie:9000
      - kuma.mealie.http.interval=60

  wallos:
    image: bellamy/wallos:latest
    container_name: wallos
    restart: unless-stopped
    networks:
      - traefik_network
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DATA_DIR}/services/wallos/db:/var/www/html/db
      - ${DATA_DIR}/services/wallos/logos:/var/www/html/images/uploads/logos
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.wallos.rule=Host(`wallos.${DOMAIN}`)
      - traefik.http.routers.wallos.entrypoints=websecure
      - traefik.http.routers.wallos.tls=true
      - traefik.http.routers.wallos.tls.certresolver=cloudflare
      # Kuma
      - kuma.wallos.http.name=Wallos
      - kuma.wallos.http.url=http://wallos:80
      - kuma.wallos.http.interval=60

  memos:
    image: neosmemo/memos:stable
    container_name: memos
    user: "${PUID}:${PGID}" # <-- Add this line
    restart: unless-stopped
    networks:
      - traefik_network
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/services/memos:/var/opt/memos
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.memos.rule=Host(`notes.${DOMAIN}`)
      - traefik.http.routers.memos.entrypoints=websecure
      - traefik.http.routers.memos.tls=true
      - traefik.http.routers.memos.tls.certresolver=cloudflare
      - traefik.http.services.memos.loadbalancer.server.port=5230
      # Kuma
      - kuma.memos.http.name=Memos
      - kuma.memos.http.url=http://memos:5230
      - kuma.memos.http.interval=60

  sparkyfitness-db:
    image: postgres:18.3-alpine
    container_name: sparkyfitness-db
    restart: unless-stopped
    networks:
      - traefik_network
    environment:
      - POSTGRES_DB=sparky_fitness
      - POSTGRES_USER=sparky
      - POSTGRES_PASSWORD=${SPARKY_FITNESS_DB_PASSWORD}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DATA_DIR}/services/sparkyfitness/db:/var/lib/postgresql


  sparkyfitness-server:
    image: codewithcj/sparkyfitness_server:latest
    container_name: sparkyfitness-server
    restart: unless-stopped
    depends_on:
      - sparkyfitness-db
    networks:
      - traefik_network
    environment:
      - TZ=${TZ}
      - ALLOW_PRIVATE_NETWORK_CORS=true
      - SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS=https://fitness.${DOMAIN}
      - SPARKY_FITNESS_DB_HOST=sparkyfitness-db
      - SPARKY_FITNESS_DB_PORT=5432
      - SPARKY_FITNESS_DB_NAME=sparky_fitness
      - SPARKY_FITNESS_DB_USER=sparky
      - SPARKY_FITNESS_DB_PASSWORD=${SPARKY_FITNESS_DB_PASSWORD}
      - SPARKY_FITNESS_APP_DB_USER=sparky_app
      - SPARKY_FITNESS_APP_DB_PASSWORD=${SPARKY_FITNESS_APP_DB_PASSWORD}
      - SPARKY_FITNESS_FRONTEND_URL=https://fitness.${DOMAIN}
      - SPARKY_FITNESS_DISABLE_SIGNUP=true
      - SPARKY_FITNESS_API_ENCRYPTION_KEY=${SPARKY_FITNESS_ENCRYPTION_KEY}
      - BETTER_AUTH_SECRET=${SPARKY_FITNESS_BETTER_AUTH}
      - JWT_SECRET=${SPARKY_FITNESS_JWT_SECRET}
      # --- Native Authelia OIDC Config ---
      - SPARKY_FITNESS_OIDC_AUTH_ENABLED=true
      - SPARKY_FITNESS_OIDC_PROVIDER_SLUG=authelia
      - SPARKY_FITNESS_OIDC_PROVIDER_NAME=Authelia
      - SPARKY_FITNESS_OIDC_ISSUER_URL=https://auth.${DOMAIN}
      - SPARKY_FITNESS_OIDC_CLIENT_ID=sparkyfitness
      - SPARKY_FITNESS_OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - SPARKY_FITNESS_OIDC_SCOPE=openid email profile groups
      - SPARKY_FITNESS_OIDC_AUTO_REGISTER=true
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DATA_DIR}/services/sparkyfitness/backup:/app/SparkyFitnessServer/backup
      - ${DATA_DIR}/services/sparkyfitness/uploads:/app/SparkyFitnessServer/uploads

  sparkyfitness-frontend:
    image: codewithcj/sparkyfitness:latest
    container_name: sparkyfitness-frontend
    restart: unless-stopped
    depends_on:
      - sparkyfitness-server
    networks:
      - traefik_network
    environment:
      - SPARKY_FITNESS_FRONTEND_URL=https://fitness.${DOMAIN}
      - SPARKY_FITNESS_SERVER_HOST=sparkyfitness-server
      - SPARKY_FITNESS_SERVER_PORT=3010
      - PUID=${PUID}
      - PGID=${PGID}
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik (Directing entry points straight to Nginx on port 80 inside the container)
      - traefik.enable=true
      - traefik.http.routers.sparky.rule=Host(`fitness.${DOMAIN}`)
      - traefik.http.routers.sparky.entrypoints=websecure
      - traefik.http.routers.sparky.tls=true
      - traefik.http.routers.sparky.tls.certresolver=cloudflare
      - traefik.http.services.sparky.loadbalancer.server.port=80
      # Kuma
      - kuma.sparky.http.name=SparkyFitness
      - kuma.sparky.http.url=http://sparkyfitness-frontend:80
      - kuma.sparky.http.interval=60

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    networks:
      - traefik_network
    volumes:
      - ${DATA_DIR}/services/seerr/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN}`)
      - traefik.http.routers.seerr.entrypoints=websecure
      - traefik.http.routers.seerr.tls=true
      - traefik.http.routers.seerr.tls.certresolver=cloudflare
      # - traefik.http.routers.seerr.middlewares=authelia@file
      - traefik.http.services.seerr.loadbalancer.server.port=5055
      # Kuma
      - kuma.seerr.http.name=Seerr
      - kuma.seerr.http.url=http://seerr:5055
      - kuma.seerr.http.interval=60

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${DATA_DIR}/services/gluetun/config.toml:/gluetun/auth/config.toml:ro
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_CITIES=${SERVER_CITIES}
      - DOT=${GLUETUN_DOT:-off}
      - DNS_ADDRESS=${GLUETUN_DNS_ADDRESS}
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY}"}
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - HTTPPROXY=on
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS}
    ports:
      - ${GLUETUN_PORT_HTTPPROXY}:${GLUETUN_PORT_HTTPPROXY}/tcp
      - ${GLUETUN_PORT_CONTROL_SERVER}:8000/tcp
      - ${SONARR_PORT}:${SONARR_PORT}/tcp
      - ${RADARR_PORT}:${RADARR_PORT}/tcp
      - ${PROWLARR_PORT}:${PROWLARR_PORT}/tcp
      - ${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}/tcp
    networks:
      - traefik_network
    restart: unless-stopped
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.routers.gluetun-api.rule=Host(`vpn-status.${DOMAIN}`)
      - traefik.http.routers.gluetun-api.entrypoints=websecure
      - traefik.http.routers.gluetun-api.tls=true
      - traefik.http.routers.gluetun-api.tls.certresolver=cloudflare
      - traefik.http.routers.gluetun-api.middlewares=authelia@file
      - traefik.http.routers.gluetun-api.service=gluetun-api
      - traefik.http.services.gluetun-api.loadbalancer.server.port=8000
      - traefik.http.routers.qbittorrent.rule=Host(`torrents.${DOMAIN}`)
      - traefik.http.routers.qbittorrent.entrypoints=websecure
      - traefik.http.routers.qbittorrent.tls=true
      - traefik.http.routers.qbittorrent.tls.certresolver=cloudflare
      - traefik.http.routers.qbittorrent.middlewares=authelia@file
      - traefik.http.routers.qbittorrent.service=qbittorrent-service
      - traefik.http.services.qbittorrent-service.loadbalancer.server.port=${QBITTORRENT_WEBUI_PORT}
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.routers.sonarr.tls.certresolver=cloudflare
      - traefik.http.routers.sonarr.middlewares=authelia@file
      - traefik.http.routers.sonarr.service=sonarr-service
      - traefik.http.services.sonarr-service.loadbalancer.server.port=${SONARR_PORT}
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls=true
      - traefik.http.routers.radarr.tls.certresolver=cloudflare
      - traefik.http.routers.radarr.middlewares=authelia@file
      - traefik.http.routers.radarr.service=radarr-service
      - traefik.http.services.radarr-service.loadbalancer.server.port=${RADARR_PORT}
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.tls=true
      - traefik.http.routers.prowlarr.tls.certresolver=cloudflare
      - traefik.http.routers.prowlarr.middlewares=authelia@file
      - traefik.http.routers.prowlarr.service=prowlarr-service
      - traefik.http.services.prowlarr-service.loadbalancer.server.port=${PROWLARR_PORT}
      - traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`)
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.routers.bazarr.tls=true
      - traefik.http.routers.bazarr.tls.certresolver=cloudflare
      - traefik.http.routers.bazarr.middlewares=authelia@file
      - traefik.http.routers.bazarr.service=bazarr-service
      - traefik.http.services.bazarr-service.loadbalancer.server.port=${BAZARR_PORT}
      # Kuma
      - kuma.vpn.port.name=VPN Gateway
      - kuma.vpn.port.hostname=gluetun
      - kuma.vpn.port.port=8000

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    volumes:
      - ${DATA_DIR}/services/qbittorrent/config:/config
      - ${DOWNLOADS_DIR}:/downloads
    restart: unless-stopped
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Kuma
      - kuma.qbittorrent.http.name=qBittorrent
      - kuma.qbittorrent.http.url=http://gluetun:${QBITTORRENT_WEBUI_PORT}/api/v2/app/version

  sonarr:
    image: ghcr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    restart: unless-stopped
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/services/sonarr/config:/config
      - ${MEDIA1_DIR}:/media
      - ${MEDIA2_DIR}:/media2
      - ${DOWNLOADS_DIR}:/downloads
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Kuma (override KUMA_SONARR_URL in .env if /ping not supported)
      - kuma.sonarr.http.name=Sonarr
      - kuma.sonarr.http.url=${KUMA_SONARR_URL:-http://gluetun:${SONARR_PORT}/ping}

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    restart: unless-stopped
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/services/radarr/config:/config
      - ${MEDIA1_DIR}:/media
      - ${MEDIA2_DIR}:/media2
      - ${DOWNLOADS_DIR}:/downloads
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Kuma
      - kuma.radarr.http.name=Radarr
      - kuma.radarr.http.url=${KUMA_RADARR_URL:-http://gluetun:${RADARR_PORT}/ping}

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    restart: unless-stopped
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/services/prowlarr/config:/config
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Kuma
      - kuma.prowlarr.http.name=Prowlarr
      - kuma.prowlarr.http.url=${KUMA_PROWLARR_URL:-http://gluetun:${PROWLARR_PORT}/ping}

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: "service:gluetun"
    restart: unless-stopped
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/services/bazarr/config:/config
      - ${MEDIA1_DIR}:/media
      - ${MEDIA2_DIR}:/media2
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Kuma
      - kuma.bazarr.http.name=Bazarr
      - kuma.bazarr.http.url=${KUMA_BAZARR_URL:-http://gluetun:${BAZARR_PORT}/api/system/status}

  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    restart: unless-stopped
    networks:
      - traefik_network
    ports:
      - 9191:9191/tcp
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
      # Behind Traefik: ignore X-Forwarded-For so login works via dispatch.${DOMAIN}.
      - DISPATCHARR_TRUSTED_PROXIES=${DISPATCHARR_TRUSTED_PROXIES:-none}
      # Block web signup — admin is created by ansible/playbooks/deploy-dispatcharr.yml
      - DISPATCHARR_SETUP_ALLOWED_IP=${DISPATCHARR_SETUP_ALLOWED_IP:-127.0.0.1}
    volumes:
      - ${DATA_DIR}/services/dispatcharr/data:/data
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    labels:
      # Watchtower
      - com.centurylinklabs.watchtower.enable=true
      # Traefik
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      # UI + unauthenticated M3U output — Authelia protected
      - traefik.http.routers.dispatcharr.rule=Host(`dispatch.${DOMAIN}`)
      - traefik.http.routers.dispatcharr.entrypoints=websecure
      - traefik.http.routers.dispatcharr.tls=true
      - traefik.http.routers.dispatcharr.tls.certresolver=cloudflare
      - traefik.http.routers.dispatcharr.middlewares=authelia@file
      - traefik.http.routers.dispatcharr.priority=1
      - traefik.http.routers.dispatcharr.service=dispatcharr-service
      # XC API for IPTV clients — no Authelia; Dispatcharr validates username + XC password
      - traefik.http.routers.dispatcharr-xc.rule=Host(`dispatch.${DOMAIN}`) && (Path(`/get.php`) || Path(`/player_api.php`) || Path(`/panel_api.php`) || Path(`/xmltv.php`) || PathPrefix(`/live/`) || PathPrefix(`/movie/`) || PathPrefix(`/series/`) || PathPrefix(`/timeshift/`) || Path(`/streaming/timeshift.php`))
      - traefik.http.routers.dispatcharr-xc.entrypoints=websecure
      - traefik.http.routers.dispatcharr-xc.tls=true
      - traefik.http.routers.dispatcharr-xc.tls.certresolver=cloudflare
      - traefik.http.routers.dispatcharr-xc.priority=100
      - traefik.http.routers.dispatcharr-xc.service=dispatcharr-service
      - traefik.http.services.dispatcharr-service.loadbalancer.server.port=9191
      # Kuma
      - kuma.dispatcharr.http.name=Dispatcharr
      - kuma.dispatcharr.http.url=${KUMA_DISPATCHARR_URL:-http://dispatcharr:9191}

networks:
  default:
    driver: bridge
  socket_proxy:
    name: socket_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.91.0/24
  traefik_network:
    name: traefik_network
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.90.0/24
