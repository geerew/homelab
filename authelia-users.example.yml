# Authelia users — copy to authelia-users.yml and edit (gitignored).
# Deploy: cd ansible && ansible-playbook playbooks/deploy-authelia.yml
#
# Set password (plain text) for Ansible to hash, OR password_hash to keep an existing hash.
# When password is set, a matching existing hash is reused if the password has not changed.

users:
  admin:
    display_name: Admin
    email: admin@example.com
    password: changeme
    groups:
      - admins

  guest:
    display_name: Guest
    email: guest@example.com
    password_hash: "$argon2id$v=19$m=65536,t=3,p=4$example$example"
    groups: []
