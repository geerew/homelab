---
# OIDC client structure for Authelia — secrets come from OIDC_CLIENT_SECRET in homelab.yaml.
# Redirect URIs are built as https://<subdomain>.<domain><path> unless extra_redirect_uris is set.

authelia_oidc_clients:
  audiobookshelf:
    client_name: Audiobookshelf
    subdomain: books
    redirect_paths:
      - /auth/openid/callback
      - /auth/openid/mobile-redirect
    extra_redirect_uris:
      - audiobookshelf://oauth
    scopes:
      - openid
      - profile
      - email
      - groups
    response_types:
      - code
    grant_types:
      - authorization_code
    access_token_signed_response_alg: none
    userinfo_signed_response_alg: none
    token_endpoint_auth_method: client_secret_basic

  jellyfin:
    client_name: Jellyfin
    subdomain: tv
    redirect_paths:
      - /sso/OID/redirect/authelia
      - /sso/OID/r/authelia
    scopes:
      - openid
      - profile
      - groups
    response_types:
      - code
    grant_types:
      - authorization_code
    access_token_signed_response_alg: none
    userinfo_signed_response_alg: none
    token_endpoint_auth_method: client_secret_post
    consent_mode: implicit

  mealie:
    client_name: Mealie
    subdomain: food
    redirect_paths:
      - /login
      - /login/
    scopes:
      - openid
      - email
      - profile
      - groups
    response_types:
      - code
    grant_types:
      - authorization_code
    access_token_signed_response_alg: none
    userinfo_signed_response_alg: none
    token_endpoint_auth_method: client_secret_basic
    require_pkce: true
    pkce_challenge_method: S256

  memos:
    client_name: Memos
    subdomain: notes
    redirect_paths:
      - /auth/callback
    scopes:
      - openid
      - email
      - profile
    response_types:
      - code
    grant_types:
      - authorization_code
    access_token_signed_response_alg: none
    userinfo_signed_response_alg: none
    token_endpoint_auth_method: client_secret_post
    require_pkce: false
    pkce_challenge_method: S256

  paperless:
    client_name: Paperless
    subdomain: paperless
    redirect_paths:
      - /accounts/oidc/authelia/login/callback/
    scopes:
      - openid
      - profile
      - email
      - groups
    response_types:
      - code
    grant_types:
      - authorization_code
    access_token_signed_response_alg: none
    userinfo_signed_response_alg: none
    token_endpoint_auth_method: client_secret_basic
    require_pkce: true
    pkce_challenge_method: S256

  sparkyfitness:
    client_name: SparkyFitness
    subdomain: fitness
    redirect_paths:
      - /api/auth/sso/callback/oidc-env
    scopes:
      - openid
      - email
      - profile
      - groups
    response_types:
      - code
    grant_types:
      - authorization_code
    userinfo_signed_response_alg: none
    token_endpoint_auth_method: client_secret_post
