---
- name: Validate OIDC client secret in homelab.yaml
  ansible.builtin.assert:
    that:
      - homelab_env.OIDC_CLIENT_SECRET is defined
      - homelab_env.OIDC_CLIENT_SECRET | length > 0
    fail_msg: Set OIDC_CLIENT_SECRET in {{ homelab_config_file }} (see homelab.example.yaml).
  when: not ansible_check_mode

- name: Resolve Authelia OIDC client secret PBKDF2 hash
  check_mode: false
  ansible.builtin.shell: |
    python3 <<'PY'
    import json
    import os
    import pathlib
    import re
    import subprocess

    password = os.environ["PASSWORD"]
    conf_path = pathlib.Path(os.environ["CONF_PATH"])
    conf_bak_path = pathlib.Path(os.environ["CONF_BAK_PATH"])

    existing_hashes: list[str] = []
    for path in (conf_path, conf_bak_path):
        if not path.is_file():
            continue
        for match in re.finditer(
            r"client_secret:\s*'(\$pbkdf2-sha512\$[^']+)'",
            path.read_text(),
        ):
            digest = match.group(1)
            if digest not in existing_hashes:
                existing_hashes.append(digest)

    def authelia(*args: str) -> subprocess.CompletedProcess[str]:
        return subprocess.run(
            ["docker", "run", "--rm", "authelia/authelia:latest", "authelia", *args],
            capture_output=True,
            text=True,
            check=False,
        )

    def generate_hash(plain: str) -> str:
        result = authelia("crypto", "hash", "generate", "pbkdf2", "--password", plain)
        if result.returncode != 0:
            raise RuntimeError(result.stderr or result.stdout or "pbkdf2 hash generate failed")
        for line in result.stdout.splitlines():
            if line.startswith("Digest:"):
                return line.split(None, 1)[1]
        raise RuntimeError(f"unexpected hash output: {result.stdout}")

    def verify_hash(plain: str, digest: str) -> bool:
        result = authelia(
            "crypto",
            "hash",
            "validate",
            "--password",
            plain,
            "--",
            digest,
        )
        return result.returncode == 0

    value = ""
    for digest in existing_hashes:
        if verify_hash(password, digest):
            value = digest
            break
    if not value:
        value = generate_hash(password)

    print(json.dumps(value))
    PY
  environment:
    PASSWORD: "{{ homelab_env.OIDC_CLIENT_SECRET }}"
    CONF_PATH: "{{ data_dir }}/services/authelia/config/configuration.yml"
    CONF_BAK_PATH: "{{ data_dir }}/services/authelia/config/configuration.yml.bak"
  register: authelia_oidc_client_secret_hash_raw
  changed_when: false
  no_log: true

- name: Set Authelia OIDC client secret hash fact
  ansible.builtin.set_fact:
    authelia_oidc_client_secret_hash: "{{ authelia_oidc_client_secret_hash_raw.stdout | from_json }}"
