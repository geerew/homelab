---
- name: Check Prowlarr config.xml exists
  ansible.builtin.stat:
    path: "{{ data_dir }}/services/prowlarr/config/config.xml"
  register: prowlarr_config_stat

- name: Fail when Prowlarr config is missing
  ansible.builtin.fail:
    msg: >-
      {{ data_dir }}/services/prowlarr/config/config.xml not found.
      Run deploy prowlarr first — Homepage reads the API key from Prowlarr's config.
  when:
    - not ansible_check_mode
    - not prowlarr_config_stat.stat.exists

- name: Read Prowlarr API key from config.xml
  ansible.builtin.slurp:
    src: "{{ data_dir }}/services/prowlarr/config/config.xml"
  register: prowlarr_config_xml
  when: prowlarr_config_stat.stat.exists | default(false)
  no_log: true

- name: Set Prowlarr API key fact for Homepage
  ansible.builtin.set_fact:
    prowlarr_api_key: >-
      {{ prowlarr_config_xml.content | b64decode | regex_search('(?<=<ApiKey>)[^<]+') }}
  when:
    - prowlarr_config_xml.content is defined
    - (prowlarr_config_xml.content | b64decode | regex_search('(?<=<ApiKey>)[^<]+')) | length > 0
  no_log: true

- name: Fail when Prowlarr API key is missing from config.xml
  ansible.builtin.fail:
    msg: >-
      No ApiKey in {{ data_dir }}/services/prowlarr/config/config.xml.
      Start Prowlarr once before deploy-homepage.
  when:
    - not ansible_check_mode
    - prowlarr_config_stat.stat.exists
    - prowlarr_api_key | default('') | length == 0
