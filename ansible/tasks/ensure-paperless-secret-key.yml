---
- name: Ensure Paperless config directory exists
  ansible.builtin.file:
    path: "{{ data_dir }}/services/paperless"
    state: directory
    owner: "{{ homelab_env.PUID | default('1000') }}"
    group: "{{ homelab_env.PGID | default('1000') }}"
    mode: "0755"

- name: Check for existing Paperless secret key
  ansible.builtin.stat:
    path: "{{ data_dir }}/services/paperless/secret_key"
  register: paperless_secret_key_file

- name: Migrate legacy Paperless secret key from homelab.yaml
  ansible.builtin.copy:
    dest: "{{ data_dir }}/services/paperless/secret_key"
    content: "{{ homelab_env.PAPERLESS_SECRET_KEY | trim }}\n"
    owner: "{{ homelab_env.PUID | default('1000') }}"
    group: "{{ homelab_env.PGID | default('1000') }}"
    mode: "0600"
  register: paperless_secret_key_migrated
  when:
    - not ansible_check_mode
    - not paperless_secret_key_file.stat.exists or (paperless_secret_key_file.stat.size | default(0)) == 0
    - homelab_env.PAPERLESS_SECRET_KEY is defined
    - homelab_env.PAPERLESS_SECRET_KEY | length > 0
  no_log: true

- name: Recheck Paperless secret key file
  ansible.builtin.stat:
    path: "{{ data_dir }}/services/paperless/secret_key"
  register: paperless_secret_key_file
  when: not ansible_check_mode

- name: Generate Paperless secret key
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import secrets, pathlib;
        pathlib.Path("{{ data_dir }}/services/paperless/secret_key").write_text(secrets.token_hex(32) + "\n")
  register: paperless_secret_key_generated
  when:
    - not ansible_check_mode
    - not paperless_secret_key_file.stat.exists or (paperless_secret_key_file.stat.size | default(0)) == 0
  changed_when: true
  no_log: true

- name: Set Paperless secret key file permissions
  ansible.builtin.file:
    path: "{{ data_dir }}/services/paperless/secret_key"
    owner: "{{ homelab_env.PUID | default('1000') }}"
    group: "{{ homelab_env.PGID | default('1000') }}"
    mode: "0600"
  when: not ansible_check_mode
