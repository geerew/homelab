---
# Back up a service directory before deploy changes (via homelab backup CLI).
#
# Vars:
#   backup_service_name — e.g. mealie
#   backup_label        — optional folder prefix (default: deploy)
#
# Requires homelab_dir from load-homelab-config.yml. Skipped in check mode by the playbook.

- name: Resolve homelab repo root for backup CLI
  ansible.builtin.set_fact:
    _homelab_dir: >-
      {{
        homelab_dir
        | default(lookup('env', 'HOMELAB_DIR') | default(playbook_dir ~ '/../..', true))
      }}

- name: Back up {{ backup_service_name }} before changes
  ansible.builtin.command:
    argv:
      - "{{ _homelab_dir }}/bin/homelab"
      - backup
      - "{{ backup_service_name }}"
      - --label
      - "{{ backup_label | default('deploy') }}"
  environment:
    HOMELAB_DIR: "{{ _homelab_dir }}"
  register: backup_service_result
  changed_when: true
