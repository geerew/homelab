---
- name: Resolve Authelia user password hashes
  check_mode: false
  ansible.builtin.shell: |
    python3 <<'PY'
    import json
    import os
    import pathlib
    import re
    import subprocess

    users = json.loads(os.environ["USERS_JSON"])
    dest_path = pathlib.Path(os.environ["DEST_PATH"])

    existing = {}
    if dest_path.is_file():
        current_user = None
        for line in dest_path.read_text().splitlines():
            user_match = re.match(r"^  ([^:\s]+):$", line)
            if user_match:
                current_user = user_match.group(1)
                continue
            pass_match = re.match(r'^    password: "(.+)"$', line)
            if pass_match and current_user:
                existing[current_user] = pass_match.group(1)

    def authelia(*args: str) -> subprocess.CompletedProcess[str]:
        return subprocess.run(
            ["docker", "run", "--rm", "authelia/authelia:latest", "authelia", *args],
            capture_output=True,
            text=True,
            check=False,
        )

    def generate_hash(password: str) -> str:
        result = authelia("crypto", "hash", "generate", "argon2", "--password", password)
        if result.returncode != 0:
            raise RuntimeError(result.stderr or result.stdout or "hash generate failed")
        for line in result.stdout.splitlines():
            if line.startswith("Digest:"):
                return line.split(None, 1)[1]
        raise RuntimeError(f"unexpected hash output: {result.stdout}")

    def verify_hash(password: str, digest: str) -> bool:
        result = authelia(
            "crypto",
            "hash",
            "validate",
            "--password",
            password,
            "--",
            digest,
        )
        return result.returncode == 0

    resolved = {}
    for username, user in users.items():
        password = (user.get("password") or "").strip()
        password_hash = (user.get("password_hash") or "").strip()
        stored_hash = existing.get(username, "")

        if password:
            if stored_hash and verify_hash(password, stored_hash):
                digest = stored_hash
            elif password_hash and verify_hash(password, password_hash):
                digest = password_hash
            else:
                digest = generate_hash(password)
        elif password_hash:
            digest = password_hash
        elif stored_hash:
            digest = stored_hash
        else:
            raise SystemExit(
                f"User {username!r} needs password or password_hash in authelia-users.yml"
            )

        resolved[username] = {
            "display_name": user["display_name"],
            "email": user["email"],
            "password_hash": digest,
            "groups": user.get("groups") or [],
        }

    print(json.dumps(resolved))
    PY
  environment:
    USERS_JSON: "{{ authelia_users_source.users | to_json }}"
    DEST_PATH: "{{ data_dir }}/services/authelia/config/users.yml"
  register: authelia_users_hashed_raw
  changed_when: false
  no_log: true

- name: Set Authelia users with resolved password hashes
  ansible.builtin.set_fact:
    authelia_users_hashed: "{{ authelia_users_hashed_raw.stdout | from_json }}"
