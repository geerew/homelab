---
- name: Deploy Authelia
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../vars/authelia_oidc_clients.yml

  pre_tasks:
    - ansible.builtin.import_tasks: ../tasks/load-homelab-config.yml
    - ansible.builtin.import_tasks: ../tasks/resolve-data-dir.yml

  tasks:
    - name: Validate Authelia secrets in homelab.yaml
      ansible.builtin.assert:
        that:
          - homelab_env.AUTHELIA_SESSION_SECRET is defined
          - homelab_env.AUTHELIA_SESSION_SECRET | length > 0
          - homelab_env.AUTHELIA_JWT_SECRET is defined
          - homelab_env.AUTHELIA_JWT_SECRET | length > 0
          - homelab_env.AUTHELIA_STORAGE_ENCRYPTION_KEY is defined
          - homelab_env.AUTHELIA_STORAGE_ENCRYPTION_KEY | length > 0
          - homelab_env.AUTHELIA_OIDC_HMAC_SECRET is defined
          - homelab_env.AUTHELIA_OIDC_HMAC_SECRET | length > 0
          - homelab_env.DOMAIN is defined
          - homelab_env.DOMAIN | length > 0
          - homelab_config.authelia.jwks_private_key is defined
          - homelab_config.authelia.jwks_private_key | length > 0
          - homelab_config.authelia.users is defined
          - homelab_config.authelia.users | length > 0
        fail_msg: >-
          Set authelia secrets, jwks_private_key, and users in {{ homelab_config_file }}
          (see homelab.example.yaml).
      when: not ansible_check_mode

    - ansible.builtin.import_tasks: ../tasks/resolve-docker-network-subnets.yml

    - name: Fail when Docker network subnets could not be resolved
      ansible.builtin.fail:
        msg: >-
          Could not resolve traefik_network and socket_proxy subnets. Deploy the compose stack
          first (site.yml) or ensure networks exist in compose.yaml.
      when:
        - not ansible_check_mode
        - docker_network_traefik_subnet | length == 0 or docker_network_socket_proxy_subnet | length == 0

    - ansible.builtin.import_tasks: ../tasks/authelia-resolve-oidc-client-secret.yml
    - ansible.builtin.import_tasks: ../tasks/authelia-resolve-password-hashes.yml

    - name: Ensure Authelia config directory exists
      ansible.builtin.file:
        path: "{{ data_dir }}/services/authelia/config"
        state: directory
        owner: "{{ homelab_env.PUID | default('1000') }}"
        group: "{{ homelab_env.PGID | default('1000') }}"
        mode: "0755"

    - name: Check for existing Authelia users.yml
      ansible.builtin.stat:
        path: "{{ data_dir }}/services/authelia/config/users.yml"
      register: authelia_users_dest_stat

    - name: Back up existing Authelia users.yml before changes
      ansible.builtin.copy:
        src: "{{ data_dir }}/services/authelia/config/users.yml"
        dest: "{{ data_dir }}/services/authelia/config/users.yml.bak"
        remote_src: true
        owner: "{{ homelab_env.PUID | default('1000') }}"
        group: "{{ homelab_env.PGID | default('1000') }}"
        mode: "0644"
      when: authelia_users_dest_stat.stat.exists

    - name: Render Authelia users.yml from template
      ansible.builtin.template:
        src: ../templates/authelia/users.yml.j2
        dest: "{{ data_dir }}/services/authelia/config/users.yml"
        owner: "{{ homelab_env.PUID | default('1000') }}"
        group: "{{ homelab_env.PGID | default('1000') }}"
        mode: "0644"
      register: authelia_users_config
      no_log: true

    - name: Check for existing Authelia configuration.yml
      ansible.builtin.stat:
        path: "{{ data_dir }}/services/authelia/config/configuration.yml"
      register: authelia_configuration_dest_stat

    - name: Back up existing Authelia configuration.yml before changes
      ansible.builtin.copy:
        src: "{{ data_dir }}/services/authelia/config/configuration.yml"
        dest: "{{ data_dir }}/services/authelia/config/configuration.yml.bak"
        remote_src: true
        owner: "{{ homelab_env.PUID | default('1000') }}"
        group: "{{ homelab_env.PGID | default('1000') }}"
        mode: "0644"
      when: authelia_configuration_dest_stat.stat.exists

    - name: Render Authelia configuration.yml from template
      ansible.builtin.template:
        src: ../templates/authelia/configuration.yml.j2
        dest: "{{ data_dir }}/services/authelia/config/configuration.yml"
        owner: "{{ homelab_env.PUID | default('1000') }}"
        group: "{{ homelab_env.PGID | default('1000') }}"
        mode: "0644"
      register: authelia_configuration_config
      no_log: true

    - name: Restart Authelia to pick up config changes
      ansible.builtin.command:
        cmd: python3 bin/homelab restart authelia
        chdir: "{{ homelab_dir }}"
      when:
        - not ansible_check_mode
        - authelia_users_config.changed or authelia_configuration_config.changed

    - name: Report Authelia deploy status
      ansible.builtin.debug:
        msg: >-
          {% if ansible_check_mode %}
          Check mode: run without --check to render Authelia config.
          {% elif authelia_users_config.changed or authelia_configuration_config.changed %}
          Deployed Authelia config from {{ homelab_config_file }} and restarted Authelia.
          {% else %}
          Authelia config unchanged — no restart needed.
          {% endif %}
