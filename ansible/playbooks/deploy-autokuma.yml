---
- name: Deploy Autokuma
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../vars/uptime_kuma_status_page.yml

  pre_tasks:
    - ansible.builtin.import_tasks: ../tasks/load-homelab-config.yml
    - ansible.builtin.import_tasks: ../tasks/resolve-data-dir.yml

  tasks:
    - name: Apply Autokuma container configuration
      ansible.builtin.import_tasks: ../tasks/compose-up-service.yml
      vars:
        compose_service: autokuma

    - name: Wait for Autokuma to sync monitors from Docker labels
      ansible.builtin.pause:
        seconds: 90
      when: not ansible_check_mode

    - name: Sync status page groups to match declared monitors
      ansible.builtin.import_tasks: ../tasks/sync-uptime-kuma-status-page.yml
      vars:
        uptime_kuma_sync_strict: false
      when: not ansible_check_mode

    - name: Report Autokuma deploy status
      ansible.builtin.debug:
        msg: >-
          {% if ansible_check_mode %}
          Check mode: run without --check to apply Autokuma from {{ homelab_config_file }}.
          {% elif uptime_kuma_status_page_sync is defined and uptime_kuma_status_page_sync.changed %}
          Autokuma running; status page /status/{{ uptime_kuma_status_page_slug }} updated
          (Homepage widget reads this slug).
          {% elif uptime_kuma_status_page_sync is defined and 'already matches' in uptime_kuma_status_page_sync.stdout %}
          Autokuma running; status page /status/{{ uptime_kuma_status_page_slug }} already
          matches Ansible vars (Homepage widget reads this slug).
          {% else %}
          Autokuma running; see status page sync task output above.
          {% endif %}
