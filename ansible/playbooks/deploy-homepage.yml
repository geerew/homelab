---
- name: Deploy Homepage
  hosts: localhost
  gather_facts: false

  vars:
    jellyfin_api_key_app_name: homepage
    homepage_static_configs:
      - bookmarks.yaml
      - settings.yaml
      - widgets.yaml
      - docker.yaml
      - proxmox.yaml
      - kubernetes.yaml

  pre_tasks:
    - ansible.builtin.import_tasks: ../tasks/load-homelab-config.yml
    - ansible.builtin.import_tasks: ../tasks/resolve-data-dir.yml

  tasks:
    - name: Validate Homepage variables in homelab.yaml
      ansible.builtin.assert:
        that:
          - homelab_env.DOMAIN is defined
          - homelab_env.DOMAIN | length > 0
          - homelab_env.DISPATCHARR_ADMIN_USERNAME is defined
          - homelab_env.DISPATCHARR_ADMIN_USERNAME | length > 0
          - homelab_env.DISPATCHARR_ADMIN_PASSWORD is defined
          - homelab_env.DISPATCHARR_ADMIN_PASSWORD | length > 0
          - homelab_env.HOMEPAGE_AUDIOBOOKSHELF_API_KEY is defined
          - homelab_env.HOMEPAGE_AUDIOBOOKSHELF_API_KEY | length > 0
          - homelab_env.HOMEPAGE_MEALIE_API_KEY is defined
          - homelab_env.HOMEPAGE_MEALIE_API_KEY | length > 0
          - homelab_env.HOMEPAGE_SONARR_API_KEY is defined
          - homelab_env.HOMEPAGE_SONARR_API_KEY | length > 0
          - homelab_env.HOMEPAGE_RADARR_API_KEY is defined
          - homelab_env.HOMEPAGE_RADARR_API_KEY | length > 0
          - homelab_env.HOMEPAGE_PROWLARR_API_KEY is defined
          - homelab_env.HOMEPAGE_PROWLARR_API_KEY | length > 0
          - homelab_env.HOMEPAGE_SEERR_API_KEY is defined
          - homelab_env.HOMEPAGE_SEERR_API_KEY | length > 0
          - homelab_env.HOMEPAGE_BAZARR_API_KEY is defined
          - homelab_env.HOMEPAGE_BAZARR_API_KEY | length > 0
        fail_msg: >-
          Set DOMAIN, DISPATCHARR_ADMIN_*, and HOMEPAGE_* widget secrets in {{ homelab_config_file }}
          (see homelab.example.yaml). Jellyfin and Gluetun keys are automatic.

    - ansible.builtin.import_tasks: ../tasks/ensure-gluetun-api-key.yml

    - name: Ensure Jellyfin API key for Homepage widget
      ansible.builtin.import_tasks: ../tasks/ensure-jellyfin-api-key.yml

    - name: Verify homepage key is listed in Jellyfin
      ansible.builtin.uri:
        url: http://127.0.0.1:8096/Auth/Keys
        headers:
          Authorization: 'MediaBrowser Token="{{ jellyfin_api_key }}"'
        return_content: true
        status_code: 200
      register: jellyfin_homepage_keys
      failed_when: >-
        jellyfin_homepage_keys.json.Items
        | selectattr('AppName', 'equalto', 'homepage')
        | list
        | length == 0
      changed_when: false
      when: not ansible_check_mode

    - name: Ensure Homepage config directory exists
      ansible.builtin.file:
        path: "{{ data_dir }}/services/homepage/config"
        state: directory
        owner: "{{ homelab_env.PUID | default('1000') }}"
        group: "{{ homelab_env.PGID | default('1000') }}"
        mode: "0755"

    - name: Deploy static Homepage config files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/homepage/{{ item }}"
        dest: "{{ data_dir }}/services/homepage/config/{{ item }}"
        owner: "{{ homelab_env.PUID | default('1000') }}"
        group: "{{ homelab_env.PGID | default('1000') }}"
        mode: "0644"
      loop: "{{ homepage_static_configs }}"
      register: homepage_static_configs_result

    - name: Render services.yaml from template
      ansible.builtin.template:
        src: ../templates/homepage/services.yaml.j2
        dest: "{{ data_dir }}/services/homepage/config/services.yaml"
        owner: "{{ homelab_env.PUID | default('1000') }}"
        group: "{{ homelab_env.PGID | default('1000') }}"
        mode: "0644"
      register: homepage_services_config
      no_log: true

    - name: Restart Homepage to pick up config changes
      community.docker.docker_container:
        name: homepage
        state: started
        restart: true
      when:
        - not ansible_check_mode
        - >-
          homepage_services_config.changed
          or (homepage_static_configs_result.results | selectattr('changed') | list | length > 0)

    - name: Report Homepage deploy status
      ansible.builtin.debug:
        msg: >-
          {% if ansible_check_mode %}
          Check mode: run without --check to render Homepage config into
          {{ data_dir }}/services/homepage/config/.
          {% elif homepage_services_config.changed or (homepage_static_configs_result.results | selectattr('changed') | list | length > 0) %}
          Deployed Homepage config ({{ homepage_static_configs | length + 1 }} files) and restarted Homepage.
          {% else %}
          Homepage config unchanged — no restart needed.
          {% endif %}
