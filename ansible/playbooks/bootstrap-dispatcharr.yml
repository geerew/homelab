---
- name: Bootstrap Dispatcharr admin user
  hosts: localhost
  gather_facts: false

  pre_tasks:
    - ansible.builtin.import_tasks: ../tasks/load-env.yml
    - ansible.builtin.import_tasks: ../tasks/resolve-data-dir.yml

  tasks:
    - name: Validate Dispatcharr admin variables in .env
      ansible.builtin.assert:
        that:
          - homelab_env.DISPATCHARR_ADMIN_USERNAME is defined
          - homelab_env.DISPATCHARR_ADMIN_USERNAME | length > 0
          - homelab_env.DISPATCHARR_ADMIN_PASSWORD is defined
          - homelab_env.DISPATCHARR_ADMIN_PASSWORD | length > 0
          - homelab_env.DISPATCHARR_ADMIN_EMAIL is defined
          - homelab_env.DISPATCHARR_ADMIN_EMAIL | length > 0
        fail_msg: >-
          Set DISPATCHARR_ADMIN_USERNAME, DISPATCHARR_ADMIN_PASSWORD, and
          DISPATCHARR_ADMIN_EMAIL in {{ env_file }} (see .env.example).

    - name: Ensure Dispatcharr data directory exists
      ansible.builtin.file:
        path: "{{ data_dir }}/dispatcharr/data"
        state: directory
        owner: "{{ homelab_env.PUID | default('1000') }}"
        group: "{{ homelab_env.PGID | default('1000') }}"
        mode: "0755"

    - name: Fix Dispatcharr uploads directory ownership
      ansible.builtin.file:
        path: "{{ data_dir }}/dispatcharr/data/uploads"
        state: directory
        owner: "{{ homelab_env.PUID | default('1000') }}"
        group: "{{ homelab_env.PGID | default('1000') }}"
        mode: "0755"

    - name: Start Gluetun VPN stack
      ansible.builtin.import_tasks: ../tasks/start-gluetun-stack.yml

    - name: Fix Dispatcharr data paths created before PUID/PGID was set
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ homelab_env.PUID | default('1000') }}"
        group: "{{ homelab_env.PGID | default('1000') }}"
        mode: "{{ item.endswith('jwt') | ternary('0600', '0755') }}"
      loop:
        - "{{ data_dir }}/dispatcharr/data/uploads"
        - "{{ data_dir }}/dispatcharr/data/jwt"
      failed_when: false

    - name: Wait for Dispatcharr web UI
      ansible.builtin.import_tasks: ../tasks/wait-for-http.yml
      vars:
        wait_url: "http://127.0.0.1:9191"

    - name: Check whether Dispatcharr admin already exists
      community.docker.docker_container_exec:
        container: dispatcharr
        command: >-
          python manage.py shell -c
          "from django.contrib.auth import get_user_model;
          print(get_user_model().objects.filter(username='{{ homelab_env.DISPATCHARR_ADMIN_USERNAME }}').exists())"
      register: dispatcharr_user_check
      changed_when: false

    # createsuperuser runs full Django checks that fail in this image (empty SECRET_KEY);
    # shell + create_superuser works and avoids shell-escaping the password.
    - name: Create Dispatcharr superuser
      community.docker.docker_container_exec:
        container: dispatcharr
        env:
          DJANGO_SUPERUSER_PASSWORD: "{{ homelab_env.DISPATCHARR_ADMIN_PASSWORD }}"
        command: >-
          python manage.py shell -c
          "import os; from django.contrib.auth import get_user_model;
          User=get_user_model();
          User.objects.create_superuser(
          '{{ homelab_env.DISPATCHARR_ADMIN_USERNAME }}',
          '{{ homelab_env.DISPATCHARR_ADMIN_EMAIL }}',
          os.environ['DJANGO_SUPERUSER_PASSWORD'])"
      when:
        - not ansible_check_mode
        - dispatcharr_user_check.stdout | default('') | trim != 'True'
      no_log: true

    - name: Report Dispatcharr bootstrap status
      ansible.builtin.debug:
        msg: >-
          {% if ansible_check_mode %}
          Check mode: run without --check to create the Dispatcharr superuser.
          {% elif dispatcharr_user_check.stdout | default('') | trim == 'True' %}
          Dispatcharr user '{{ homelab_env.DISPATCHARR_ADMIN_USERNAME }}' already exists — no changes made.
          {% else %}
          Created Dispatcharr superuser '{{ homelab_env.DISPATCHARR_ADMIN_USERNAME }}'.
          {% endif %}
