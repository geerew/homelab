---
- name: Deploy Radarr
  hosts: localhost
  gather_facts: false

  pre_tasks:
    - ansible.builtin.import_tasks: ../tasks/load-homelab-config.yml
    - ansible.builtin.import_tasks: ../tasks/resolve-data-dir.yml

  tasks:
    - name: Validate Radarr variables in homelab.yaml
      ansible.builtin.assert:
        that:
          - homelab_config.radarr.volumes is defined
          - homelab_config.radarr.volumes | length > 0
          - homelab_env.RADARR_ROOT_FOLDERS is defined
          - homelab_env.RADARR_ROOT_FOLDERS | from_json | length > 0
          - homelab_env.RADARR_INDEXERS is defined
          - homelab_env.RADARR_INDEXERS | from_json | length > 0
          - homelab_env.QBITTORRENT_WEBUI_USERNAME is defined
          - homelab_env.QBITTORRENT_WEBUI_USERNAME | length > 0
          - homelab_env.QBITTORRENT_WEBUI_PASSWORD is defined
          - homelab_env.QBITTORRENT_WEBUI_PASSWORD | length > 0
        fail_msg: >-
          Set radarr.volumes, root_folders, indexers, and qbittorrent.webui_* in
          {{ homelab_config_file }} (see homelab.example.yaml).
      when: not ansible_check_mode

    - name: Validate Radarr indexers reference Prowlarr
      ansible.builtin.assert:
        that:
          - (item is string and item | length > 0)
            or (item.prowlarr_indexer is defined and item.prowlarr_indexer | length > 0)
        fail_msg: >-
          Each radarr.indexers entry must be a Prowlarr indexer name (string) or
          { prowlarr_indexer: ... } in {{ homelab_config_file }}.
      loop: "{{ homelab_env.RADARR_INDEXERS | from_json }}"
      loop_control:
        label: "{{ item.prowlarr_indexer | default(item) }}"
      when: not ansible_check_mode

    - ansible.builtin.include_tasks: ../tasks/backup-service-data.yml
      vars:
        backup_service_name: radarr
      when: not ansible_check_mode

    - name: Ensure Radarr config directory exists
      ansible.builtin.file:
        path: "{{ data_dir }}/services/radarr/config"
        state: directory
        owner: "{{ homelab_env.PUID | default('1000') }}"
        group: "{{ homelab_env.PGID | default('1000') }}"
        mode: "0755"

    - name: Regenerate compose.yaml with current Radarr volume mounts
      ansible.builtin.command:
        cmd: python3 bin/homelab compose generate
        chdir: "{{ homelab_dir }}"
      changed_when: false
      when: not ansible_check_mode

    - ansible.builtin.import_tasks: ../tasks/compose-up-service.yml
      vars:
        compose_service: radarr

    - name: Wait for Radarr HTTP health
      ansible.builtin.command:
        argv:
          - curl
          - -fsS
          - "http://127.0.0.1:{{ homelab_env.RADARR_PORT | default('7878') }}/ping"
      register: radarr_health_wait
      until: radarr_health_wait.rc == 0
      retries: 24
      delay: 5
      changed_when: false
      when: not ansible_check_mode

    - ansible.builtin.import_tasks: ../tasks/wait-for-gluetun-dependency.yml
      vars:
        dependency_name: Prowlarr
        dependency_url: "http://127.0.0.1:{{ homelab_env.PROWLARR_PORT | default('9696') }}/ping"

    - ansible.builtin.import_tasks: ../tasks/wait-for-gluetun-dependency.yml
      vars:
        dependency_name: qBittorrent
        dependency_url: "http://127.0.0.1:{{ homelab_env.QBITTORRENT_WEBUI_PORT | default('9865') }}/api/v2/app/version"

    - ansible.builtin.import_tasks: ../tasks/bootstrap-radarr.yml

    - name: Report Radarr deploy status
      ansible.builtin.debug:
        msg: >-
          {% if ansible_check_mode %}
          Check mode: run without --check to deploy Radarr from {{ homelab_config_file }}.
          {% elif radarr_bootstrap.changed | default(false) %}
          Radarr configured — external auth enforced, settings applied from homelab.yaml.
          {% else %}
          Radarr unchanged — settings already in sync with homelab.yaml.
          {% endif %}
