---
# Deploy all application config playbooks in dependency order.
#
# Prerequisite: ansible-playbook playbooks/site.yml
#   (creates service dirs, starts containers, and creates Docker networks)
#
# Order:
#   1. Socket Proxy     — filtered Docker API; required by Traefik, Homepage, Dozzle, Autokuma
#   2. Watchtower       — container auto-updates (label-gated)
#   3. Dozzle           — log viewer via Socket Proxy (Authelia at Traefik edge)
#   4. Traefik          — static + dynamic config (Authelia forward-auth middleware)
#   5. Cloudflare DDNS  — keeps DNS records pointed at this host
#   6. Authelia         — auth provider; resolves traefik_network / socket_proxy subnets
#   7. Gluetun          — VPN gateway; Sonarr/Radarr/Prowlarr/Bazarr/qBittorrent share its network
#   8. Dispatcharr      — IPTV; Jellyfin Live TV M3U tuner points at its /output/m3u/
#   9. qBittorrent      — WebUI config; LAN bypass uses traefik_network subnet from Gluetun stack
#  10. Jellyfin         — Live TV tuner registration requires Dispatcharr M3U to be populated
#  11. Homepage         — service list + widgets reference the above (deploy last)

- name: Deploy Socket Proxy
  ansible.builtin.import_playbook: deploy-socket-proxy.yml

- name: Deploy Watchtower
  ansible.builtin.import_playbook: deploy-watchtower.yml

- name: Deploy Dozzle
  ansible.builtin.import_playbook: deploy-dozzle.yml

- name: Deploy Traefik
  ansible.builtin.import_playbook: deploy-traefik.yml

- name: Deploy Cloudflare DDNS
  ansible.builtin.import_playbook: deploy-cloudflare-ddns.yml

- name: Deploy Authelia
  ansible.builtin.import_playbook: deploy-authelia.yml

- name: Deploy Gluetun
  ansible.builtin.import_playbook: deploy-gluetun.yml

- name: Deploy Dispatcharr
  ansible.builtin.import_playbook: deploy-dispatcharr.yml

- name: Deploy qBittorrent
  ansible.builtin.import_playbook: deploy-qbittorrent.yml

- name: Deploy Jellyfin
  ansible.builtin.import_playbook: deploy-jellyfin.yml

- name: Deploy Homepage
  ansible.builtin.import_playbook: deploy-homepage.yml
