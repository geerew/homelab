# --- Core ---
core:
  data_dir: .
  puid: 1000
  pgid: 1000
  tz: Europe/London
  domain: example.com
  acme_email: "admin@example.com"

# --- Infrastructure ---
socket_proxy:
  log_level: warning
  allow_start: 1
  allow_stop: 1
  allow_restarts: 1
  events: 1
  ping: 1
  version: 1
  auth: 0
  secrets: 0
  post: 1
  build: 0
  commit: 0
  configs: 0
  containers: 1
  distribution: 0
  exec: 0
  images: 1
  info: 1
  networks: 1
  nodes: 0
  plugins: 0
  services: 1
  session: 0
  swarm: 0
  system: 0
  tasks: 1
  volumes: 1
  disable_ipv6: 0
watchtower:
  cleanup: true
  poll_interval: 86400
  label_enable: true
dozzle:
  level: info
  filter: "status=running"
  remote_host: "tcp://socket-proxy:2375"
  auth_provider: "forward-proxy"
  auth_header_user: "Remote-User"
cloudflare:
  api_token: ''
  ddns_domains: ''
  ddns_proxied: true
  ddns_detection_mode: cloudflare.trace
  ddns_http_timeout: 10s

# --- Authentication ---
authelia:
  session_secret: ''
  jwt_secret: ''
  storage_encryption_key: ''
  oidc_hmac_secret: ''
  oidc_client_secret: ''
  jwks_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    ...
    -----END RSA PRIVATE KEY-----
  users:
    admin:
      display_name: Admin
      email: "admin@example.com"
      password: changeme
      groups:
        - admins

# --- Monitoring & dashboard ---
uptime_kuma:
  bazarr_url: ''
  sonarr_url: ''
  radarr_url: ''
  prowlarr_url: ''
  dispatcharr_url: ''
homepage:
  seerr_api_key: ''

# --- Shared media paths ---
media:
  media1_dir: /mnt/media1
  media2_dir: /mnt/media2
  audiobooks_dir: /mnt/audiobooks
  downloads_dir: /downloads

# --- VPN & *arr stack ---
gluetun:
  api_key: ''
  vpn_service_provider: custom  # see Gluetun docs for supported providers
  vpn_type: wireguard
  wireguard_private_key: ''
  wireguard_addresses: ''
  server_cities: ''
  dot: false
  dns_address: 1.1.1.1
  firewall_outbound_subnets: 192.168.0.0/24
  ports:
    httpproxy: 8888
    control_server: 8080
    sonarr: 8989
    radarr: 7878
    prowlarr: 9696
    bazarr: 6767
    qbittorrent_webui: 9865
qbittorrent:
  webui_username: admin
  webui_password: ''
  lan_auth_bypass: true
prowlarr:
  indexers:
    - name: Public Indexer
      definition: public_tracker
      enable: true
      private: false
    - name: Private Indexer
      definition: private_tracker
      enable: true
      private: true
      username: ''
      password: ''
sonarr:
  volumes:
    - host: /mnt/media1
      container: /media
    - host: /mnt/media2
      container: /media2
    - host: /downloads
      container: /downloads
  root_folders:
    - /media/TV
  indexers:
    - Public Indexer
    - Private Indexer
  naming:
    rename_episodes: true
    standard_episode_format: "{Series Title} - s{season:00}e{episode:00} - {Episode Title}"
    series_folder_format: "{Series Title}"
    season_folder_format: "Season {season}"
  library_import:
    enabled: true
  # TV runtimes vary (long episodes, season packs). Lower mins than Radarr movies.
  quality_definitions:
    720p:
      min: 3
      preferred: 15
      max: 26
    1080p:
      min: 5
      preferred: 50
      max: 82
  quality_profiles:
    - name: HD-720p
      cutoff: Bluray-720p
      upgrade: false
      qualities:
        - HDTV-720p
        - WEBDL-720p
        - WEBRip-720p
        - Bluray-720p
    - name: HD-1080p
      cutoff: Bluray-1080p
      upgrade: false
      qualities:
        - HDTV-1080p
        - WEBDL-1080p
        - WEBRip-1080p
        - Bluray-1080p
radarr:
  volumes:
    - host: /mnt/media1
      container: /media
    - host: /mnt/media2
      container: /media2
    - host: /downloads
      container: /downloads
  root_folders:
    - /media/Movies
  indexers:
    - Public Indexer
    - Private Indexer
  naming:
    rename_movies: true
    standard_movie_format: "{Movie Title} ({Release Year})"
  library_import:
    enabled: true
  # File size limits (MB/min). Radarr uses runtime to estimate size:
  # size ≈ MB/min × runtime. At 100 min: 20 ≈ 2 GB, 26 ≈ 2.5 GB, 82 ≈ 8 GB.
  quality_definitions:
    720p:
      min: 10
      preferred: 20
      max: 26
    1080p:
      min: 15
      preferred: 60
      max: 82
  quality_profiles:
    - name: HD-720p
      cutoff: Bluray-720p
      upgrade: false
      qualities:
        - HDTV-720p
        - WEBDL-720p
        - WEBRip-720p
        - Bluray-720p
    - name: HD-1080p
      cutoff: Bluray-1080p
      upgrade: false
      qualities:
        - HDTV-1080p
        - WEBDL-1080p
        - WEBRip-1080p
        - Bluray-1080p

bazarr:
  volumes:
    - host: /mnt/media1
      container: /media
    - host: /mnt/media2
      container: /media2
  auth: none
  sonarr:
    enabled: true
  radarr:
    enabled: true
  languages:
    - en
  language_profiles:
    - name: English
      tag: english
      languages:
        - en
  defaults:
    series_profile: English
    movie_profile: English
  providers:
    enabled:
      - yifysubtitles
      - opensubtitlescom
      - subdl
    opensubtitlescom:
      username: ''
      password: ''
      use_hash: true
      include_ai_translated: false
      include_machine_translated: false
    subdl:
      api_key: ''
      ai_translate: false
      include_ai_translated: false

# --- IPTV ---
dispatcharr:
  admin_username: admin
  admin_password: ''
  admin_email: ''
  trusted_proxies: none
  setup_allowed_ip: 127.0.0.1
  m3u_name: ''
  m3u_url: ''
  m3u_username: ''
  m3u_password: ''
  m3u_account_type: XC
  m3u_max_streams: 1
  m3u_refresh_interval: 24
  xc_password: ''

# --- Apps ---
audiobookshelf:
  volumes:
    - host: /mnt/audiobooks
      container: /audiobooks
  root_username: admin
  root_password: ''
  libraries:
    - name: Audiobooks
      media_type: book
      provider: audible  # metadata provider id from Audiobookshelf
      settings:
        coverAspectRatio: 1
        disableWatcher: false
      folders:
        - /audiobooks/Books
mealie:
  admin_username: admin
  admin_password: ''
  openai_api_key: ''
jellyscope:
  admin_username: admin
  admin_password: ''
  secret_key: ''
memos:
  admin_username: admin
  admin_password: ''
  admin_email: ''

# --- Other ---
mcclean:
  admin_username: admin
  admin_password: ''
sparkyfitness:
  db_password: ''
  app_db_password: ''
  encryption_key: ''
  better_auth: ''
  jwt_secret: ''
